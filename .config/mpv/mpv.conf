# Ink — mpv. Decodificación por hardware y OSD en grises.
# La coma final: si gpu-next no arranca en tu GPU, mpv prueba con «gpu» y luego con el resto (en vez de fallar).
vo=gpu-next,gpu,
hwdec=auto-safe
keep-open=yes
save-position-on-quit=yes
volume-max=100

osd-font="JetBrainsMono Nerd Font"
osd-font-size=32
osd-color="#e8e8e8"
osd-border-color="#0a0a0a"
osd-bar-align-y=0.9
