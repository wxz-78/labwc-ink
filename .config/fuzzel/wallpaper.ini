# Ink — fuzzel. Estilo Spotlight, minimalista en grises.
# Selector de fondos (`wallpaper pick`): mismos colores, filas altas para las miniaturas.
[main]
font=JetBrainsMono Nerd Font Mono:size=12
terminal=foot -e
prompt="󰍉  "
placeholder=Buscar…
icon-theme=Papirus-Dark
layer=overlay
anchor=center
# dpi-aware=no: tamaños predecibles (si no, fuzzel se agranda con el DPI de la pantalla y se sale de ella,
# mientras waybar/mako siguen en px fijos). Si lo ves pequeño, sube font size / line-height.
dpi-aware=no
width=44
lines=6
horizontal-pad=28
vertical-pad=20
inner-pad=12
line-height=56
image-size-ratio=0.95
fields=name,generic,keywords,exec
show-actions=no

[colors]
background=0e0e0ef6
text=a9a9a9ff
prompt=8a8a8aff
placeholder=5e5e5eff
input=ffffffff
match=ffffffff
selection=ffffff24
selection-text=ffffffff
selection-match=ffffffff
counter=5e5e5eff
border=ffffff22

[border]
width=1
radius=18
# Esquinas redondeadas en la fila seleccionada (fuzzel >= 1.12; si tu versión da error, borra esta línea)
selection-radius=10

[dmenu]
exit-immediately-if-empty=yes
